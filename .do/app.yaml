name: pop3
region: fra

domains:
  - domain: adoonline.online
    type: PRIMARY
  - domain: adoonline.pics
    type: ALIAS

services:
  - name: web
    github:
      repo: nlevis625-web/pop-3
      branch: master
      deploy_on_push: true
    build_command: npm install && npm run build
    run_command: npm start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    envs:
      - key: ALLOWED_HOSTS
        value: adoonline.online,adoonline.pics
        scope: RUN_TIME
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
